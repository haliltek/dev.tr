services:
  daily-redis:
    image: redis:6-alpine
    container_name: devcore-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 60
    deploy:
      resources:
        limits:
          memory: 256M

  daily-postgres:
    image: postgres:15.4-alpine
    container_name: devcore-postgres
    restart: always
    environment:
      - POSTGRES_DB=api
      - POSTGRES_PASSWORD=12345
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d api']
      interval: 1s
      timeout: 3s
      retries: 60
    command:
      - 'postgres'
      - '-c'
      - 'wal_level=logical'
    deploy:
      resources:
        limits:
          memory: 384M

  daily-api:
    image: us.gcr.io/daily-ops/daily-api:latest
    container_name: devcore-api
    restart: always
    depends_on:
      daily-postgres:
        condition: service_healthy
      daily-redis:
        condition: service_healthy
    command: ['npm', 'run', 'start']
    ports:
      - '127.0.0.1:5000:5000'
    volumes:
      - /root/devcore-tr/.cert:/opt/app/.cert
    environment:
      - NODE_ENV=development
      - MOCK_EXTERNAL_SERVICES=true
      - TYPEORM_HOST=daily-postgres
      - PORT=5000
      - TZ=UTC
      - ACCESS_SECRET=topsecret
      - URL_PREFIX=http://localhost:4000
      - COMMENTS_PREFIX=http://localhost:5002
      - REDIS_HOST=daily-redis
      - REDIS_PORT=6379
      - COOKIES_KEY=topsecret
      - JWT_SECRET=|r+.2!!!.Qf_-|63*%.D
      - JWT_AUDIENCE=Daily Staging
      - JWT_ISSUER=Daily API Staging
      - JWT_PUBLIC_KEY_PATH=/opt/app/.cert/public.pem
      - JWT_PRIVATE_KEY_PATH=/opt/app/.cert/key.pem
      - GROWTHBOOK_CLIENT_KEY=local
      - MOCK_USER_ID=testuser
      - NJORD_ORIGIN=http://127.0.0.1:9999
      - FREYJA_ORIGIN=http://127.0.0.1:9999
      - GONDUL_ORIGIN=http://127.0.0.1:9999
      - GONDUL_OPPORTUNITY_SERVER_ORIGIN=http://127.0.0.1:9999
      - BROKKR_ORIGIN=http://127.0.0.1:9999
      - FLYTING_ORIGIN=http://127.0.0.1:9999
      - LOFN_ORIGIN=http://127.0.0.1:9999
      - MAGNI_ORIGIN=http://127.0.0.1:9999
      - MIMIR_ORIGIN=http://127.0.0.1:9999
      - SKADI_ORIGIN=http://127.0.0.1:9999
      - SKADI_API_ORIGIN_V2=http://127.0.0.1:9999
      - SNOTRA_ORIGIN=http://127.0.0.1:9999
      - SNOTRA_USER_API_ORIGIN=http://127.0.0.1:9999
      - YGGDRASIL_ORIGIN=http://127.0.0.1:9999
      - YGGDRASIL_SENTIMENT_ORIGIN=http://127.0.0.1:9999
    deploy:
      resources:
        limits:
          memory: 512M

  devcore-webapp:
    image: node:24.18-alpine
    container_name: devcore-webapp
    restart: always
    depends_on:
      - daily-api
    working_dir: /opt/app/packages/webapp
    ports:
      - '0.0.0.0:3096:5002'
    volumes:
      - /root/devcore-tr/apps:/opt/app
      - webapp_next:/opt/app/packages/webapp/.next
    environment:
      - NODE_ENV=development
      - PORT=5002
      - NEXT_PUBLIC_API_URL=http://daily-api:5000
      - NEXT_PUBLIC_DOMAIN=localhost
      - NODE_OPTIONS=--max-old-space-size=1800
    command: ["npx", "next", "dev", "--turbopack", "-p", "5002"]
  devcore-admin:
    image: node:24.18-alpine
    container_name: devcore-admin
    restart: always
    depends_on:
      - daily-api
    working_dir: /opt/app/packages/admin
    ports:
      - '127.0.0.1:5003:5003'
    volumes:
      - /root/devcore-tr/apps:/opt/app
      - admin_next:/opt/app/packages/admin/.next
    environment:
      - NODE_ENV=production
      - PORT=5003
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=DevcoreAdmin2026!
      - BACKOFFICE_BACKEND_URL=http://daily-api:5000
    command: ["npx", "next", "start", "-p", "5003"]
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  pg_data:
  redis_data:
  webapp_next:
  admin_next:
